name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .rbz package
        run: |
          cd src
          zip -r ../SketchupMenuiseriesMaker.rbz MenuiseriesExterieures.rb MenuiseriesExterieures/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: SketchupMenuiseriesMaker.rbz
